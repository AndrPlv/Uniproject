<!doctype html>
<html>
    <head>
        <title>Моя метеостанция</title>
        <script src="https://cdn.plot.ly/plotly-3.4.0.min.js"></script>
        <script>
            async function updateData() {
                const response = await fetch('/update');
                const data = await response.json();
                
                console.log("NEW DATA");
                // Температура
                Plotly.react('Temgraph', [{
                    x: data.Time,
                    y: data.Temperature,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Температура',
                    line: {color: 'red'}
                }]);
                
                // Влажность
                Plotly.react('Humgraph', [{
                    x: data.Time,
                    y: data.Humidity,
                    type: 'scatter',
                    mode: 'lines',
                    name: 'Влажность',
                    line: {color: 'blue'}
                }]);

                document.getElementById('Table').innerHTML = data.Table;
                setTimeout(updateData, 5000);
            }
            updateData();
        </script>
        <style>
        * {
            margin: 0;        
            padding: 0;   
            box-sizing: border-box;  
        }
        body {
            background-color: rgb(131, 170, 207);
            text-align: center;
        }
        title {
            background-color: white;
            border: 15px solid white;
            border-radius: 10px;
            padding: 5px;
        }
        body .box {
            background-color: rgb(202, 209, 245);
            border: 10px solid rgb(100, 100, 255);
            border-radius: 5px;
        }
        body .table {
            position: absolute; left: 0px; top: 50px;
        }
        body .graphTem {
            position: absolute; left: 0px; top: 500px;
        }
        body .graphHum {
            position: absolute; left: 750px; top: 500px;
        }       
        </style>
        </head>
    <body>
        <h1 class="title">Моя метеостанция</h1>

        <div class="box table" id="Table">{{ table|safe }}</div>
        <div class="box graphTem" id="Temgraph">{{ Temgrapch|safe }}</div>
        <div class="box graphHum" id="Humgraph">{{ Humgrapch|safe }}</div>        
    </body>
</html>
